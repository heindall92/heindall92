<svg xmlns="http://www.w3.org/2000/svg" width="163" height="44" viewBox="0 0 163 44" role="img" aria-label="Hack The Box"><title>Hack The Box</title><style>

text{font-family:'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;fill:#eef1f3}
.mono{font-family:'Geist Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace}
/* Visible por defecto: si el visor no anima el SVG, el contenido se ve igual */
.in{animation:in .9s cubic-bezier(.32,.72,0,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}.d6{animation-delay:.48s}.d7{animation-delay:.56s}
.flow{stroke-dasharray:4 7;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="162" height="43" rx="22" fill="#111317" stroke="rgba(255,255,255,.13)"/><g transform="translate(18 13) scale(0.75)" fill="none" stroke="#6b9bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g><text x="44" y="27.5" font-size="14.5" font-weight="550">Hack The Box</text></svg>
