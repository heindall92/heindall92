<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="414" viewBox="0 0 1200 414" role="img" aria-label="Auditoría técnica: Nmap, Burp Suite, BloodHound, PingCastle, Nessus, OpenVAS, Nuclei, OWASP ZAP. Defensa y DFIR: Wazuh, Sysmon, Event Logs, Wireshark, Cowrie, NTFS / $MFT, MITRE ATT&amp;CK. GRC: ENS (RD 311/2022), ISO/IEC 27001, ISO 22301, ISO/IEC 42001, NIS2, DORA, NIST CSF 2.0, MAGERIT, CCN-STIC. Desarrollo: Python, FastAPI, TypeScript, React, Vite, Tailwind, Playwright, axe-core, Docker, Ollama"><title>Auditoría técnica: Nmap, Burp Suite, BloodHound, PingCastle, Nessus, OpenVAS, Nuclei, OWASP ZAP. Defensa y DFIR: Wazuh, Sysmon, Event Logs, Wireshark, Cowrie, NTFS / $MFT, MITRE ATT&amp;CK. GRC: ENS (RD 311/2022), ISO/IEC 27001, ISO 22301, ISO/IEC 42001, NIS2, DORA, NIST CSF 2.0, MAGERIT, CCN-STIC. Desarrollo: Python, FastAPI, TypeScript, React, Vite, Tailwind, Playwright, axe-core, Docker, Ollama</title><style>

