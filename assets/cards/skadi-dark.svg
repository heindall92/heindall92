<svg xmlns="http://www.w3.org/2000/svg" width="580" height="150" viewBox="0 0 580 150" role="img" aria-label="SKADI (heindall92/skadi). Escáner web que orquesta herramientas abiertas y resume los resultados con IA local."><title>SKADI (heindall92/skadi). Escáner web que orquesta herramientas abiertas y resume los resultados con IA local.</title><style>

