<g class="in d3"><text x="22" y="96" font-size="14.5" fill="#a3aab2">Un SOC que cabe en un portátil: detecta,</text><text x="22" y="117" font-size="14.5" fill="#a3aab2">investiga con IA local e informa.</text></g></svg>
