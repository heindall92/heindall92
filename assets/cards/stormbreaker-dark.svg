<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-label="Stormbreaker. Consola de análisis forense avanzado para responder a incidentes."><title>Stormbreaker. Consola de análisis forense avanzado para responder a incidentes.</title><style>

text{font-family:'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;fill:#eef1f3}
.mono{font-family:'Geist Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace}
/* Visible por defecto: si el visor no anima el SVG, el contenido se ve igual */
.in{animation:in .9s cubic-bezier(.32,.72,0,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}.d6{animation-delay:.48s}.d7{animation-delay:.56s}
.flow{stroke-dasharray:4 7;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="579" height="209" rx="22" fill="#111317" stroke="rgba(255,255,255,.13)"/>
<g class="in"><rect x="26" y="26" width="48" height="48" rx="14" fill="rgba(107,155,255,.14)"/><g transform="translate(38 38) scale(1)" fill="none" stroke="#6b9bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h.01"/><path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M21.946 12.013H2.054"/><path d="M6 16h.01"/></g></g>
<g class="in d1"><text x="90" y="49" font-size="20" font-weight="650" letter-spacing="-.015em">Stormbreaker</text>
<text x="90" y="70" class="mono" font-size="12" fill="#8f97a0">DFIR</text></g>
<g class="in d2"><text x="28" y="110" font-size="15" fill="#a3aab2">Consola de análisis forense avanzado</text><text x="28" y="132" font-size="15" fill="#a3aab2">para responder a incidentes.</text></g>
<g class="in d3"><rect x="28" y="166" width="46.4" height="24" rx="12" fill="#171a1f"/><text x="51.2" y="182" font-size="11.5" font-weight="500" text-anchor="middle" fill="#a3aab2">DFIR</text><rect x="80.4" y="166" width="66.19999999999999" height="24" rx="12" fill="#171a1f"/><text x="113.5" y="182" font-size="11.5" font-weight="500" text-anchor="middle" fill="#a3aab2">Forense</text><rect x="152.6" y="166" width="79.4" height="24" rx="12" fill="#171a1f"/><text x="192.3" y="182" font-size="11.5" font-weight="500" text-anchor="middle" fill="#a3aab2">Blue Team</text></g>
