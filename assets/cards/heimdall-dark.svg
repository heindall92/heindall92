<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-label="Heimdall TimeWatch. Detecta la manipulación de marcas de tiempo en NTFS, mapeada a MITRE ATT&amp;CK."><title>Heimdall TimeWatch. Detecta la manipulación de marcas de tiempo en NTFS, mapeada a MITRE ATT&amp;CK.</title><style>

text{font-family:'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;fill:#eef1f3}
.mono{font-family:'Geist Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace}
/* Visible por defecto: si el visor no anima el SVG, el contenido se ve igual */
.in{animation:in .9s cubic-bezier(.32,.72,0,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}.d6{animation-delay:.48s}.d7{animation-delay:.56s}
.flow{stroke-dasharray:4 7;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="579" height="209" rx="22" fill="#111317" stroke="rgba(255,255,255,.13)"/>
<g class="in"><rect x="26" y="26" width="48" height="48" rx="14" fill="rgba(107,155,255,.14)"/><g transform="translate(38 38) scale(1)" fill="none" stroke="#6b9bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g></g>
<g class="in d1"><text x="90" y="49" font-size="20" font-weight="650" letter-spacing="-.015em">Heimdall TimeWatch</text>
<text x="90" y="70" class="mono" font-size="12" fill="#8f97a0">DFIR · NTFS</text></g>
<g class="in d2"><text x="28" y="110" font-size="15" fill="#a3aab2">Detecta la manipulación de marcas de tiempo</text><text x="28" y="132" font-size="15" fill="#a3aab2">en NTFS, mapeada a MITRE ATT&amp;CK.</text></g>
<g class="in d3"><rect x="28" y="166" width="46.4" height="24" rx="12" fill="#171a1f"/><text x="51.2" y="182" font-size="11.5" font-weight="500" text-anchor="middle" fill="#a3aab2">NTFS</text><rect x="80.4" y="166" width="59.599999999999994" height="24" rx="12" fill="#171a1f"/><text x="110.2" y="182" font-size="11.5" font-weight="500" text-anchor="middle" fill="#a3aab2">ATT&amp;CK</text><rect x="146" y="166" width="46.4" height="24" rx="12" fill="#171a1f"/><text x="169.2" y="182" font-size="11.5" font-weight="500" text-anchor="middle" fill="#a3aab2">DFIR</text></g>
</svg>
