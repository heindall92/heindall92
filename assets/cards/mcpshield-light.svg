<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-label="MCP-Shield. Audita las configuraciones MCP de los asistentes de IA, sin salir del navegador."><title>MCP-Shield. Audita las configuraciones MCP de los asistentes de IA, sin salir del navegador.</title><style>

text{font-family:'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;fill:#101418}
.mono{font-family:'Geist Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace}
/* Visible por defecto: si el visor no anima el SVG, el contenido se ve igual */
.in{animation:in .9s cubic-bezier(.32,.72,0,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}.d6{animation-delay:.48s}.d7{animation-delay:.56s}
.flow{stroke-dasharray:4 7;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
