<svg xmlns="http://www.w3.org/2000/svg" width="580" height="210" viewBox="0 0 580 210" role="img" aria-label="Dark Spear. Auditoría autorizada por fases, con aprobación humana en cada paso y un informe defendible."><title>Dark Spear. Auditoría autorizada por fases, con aprobación humana en cada paso y un informe defendible.</title><style>

text{font-family:'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;fill:#101418}
.mono{font-family:'Geist Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace}
/* Visible por defecto: si el visor no anima el SVG, el contenido se ve igual */
.in{animation:in .9s cubic-bezier(.32,.72,0,1) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}.d6{animation-delay:.48s}.d7{animation-delay:.56s}
.flow{stroke-dasharray:4 7;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="579" height="209" rx="22" fill="#ffffff" stroke="rgba(16,20,24,.14)"/>
<g class="in"><rect x="26" y="26" width="48" height="48" rx="14" fill="rgba(26,79,224,.10)"/><g transform="translate(38 38) scale(1)" fill="none" stroke="#1a4fe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/></g></g>
<g class="in d1"><text x="90" y="49" font-size="20" font-weight="650" letter-spacing="-.015em">Dark Spear</text>
<text x="90" y="70" class="mono" font-size="12" fill="#5c6773">Python · FastAPI · panel ES/EN</text></g>
<g class="in d2"><text x="28" y="110" font-size="15" fill="#2c3440">Auditoría autorizada por fases, con aprobación</text><text x="28" y="132" font-size="15" fill="#2c3440">humana en cada paso y un informe defendible.</text></g>
<g class="in d3"><rect x="28" y="166" width="86" height="24" rx="12" fill="#eef1f4"/><text x="71" y="182" font-size="11.5" font-weight="500" text-anchor="middle" fill="#2c3440">Scope-lock</text><rect x="120" y="166" width="59.599999999999994" height="24" rx="12" fill="#eef1f4"/><text x="149.8" y="182" font-size="11.5" font-weight="500" text-anchor="middle" fill="#2c3440">ATT&amp;CK</text><rect x="185.6" y="166" width="66.19999999999999" height="24" rx="12" fill="#eef1f4"/><text x="218.7" y="182" font-size="11.5" font-weight="500" text-anchor="middle" fill="#2c3440">Informe</text></g>
