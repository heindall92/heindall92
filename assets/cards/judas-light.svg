<svg xmlns="http://www.w3.org/2000/svg" width="580" height="150" viewBox="0 0 580 150" role="img" aria-label="JUDAS (heindall92/Judas_Pentesting-Tool). Auditoría de Active Directory en laboratorios autorizados, con estado entre sesiones."><title>JUDAS (heindall92/Judas_Pentesting-Tool). Auditoría de Active Directory en laboratorios autorizados, con estado entre sesiones.</title><style>

